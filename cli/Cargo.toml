[package]
name = "openapi-collection-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Evidence-first local conversion between OpenAPI, Postman, Insomnia, Bruno, and cURL"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-openapi-collection-bridge"
readme = "../README.md"
keywords = ["openapi", "postman", "insomnia", "bruno", "curl"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ocb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shell-words = "1.1"

[dev-dependencies]
tempfile = "3.14"

